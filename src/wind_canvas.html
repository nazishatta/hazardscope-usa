<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#080c15;color:#dbe6f6;font:13px -apple-system,BlinkMacSystemFont,Arial,sans-serif}
#wrap{position:relative;width:100%;height:505px;overflow:hidden;border:1px solid #263348;border-radius:12px;background:#080c15}
canvas{width:100%;height:100%;display:block}#bar{position:absolute;bottom:12px;left:12px;display:flex;gap:8px;align-items:center;background:#0e1829e8;padding:8px 12px;border:1px solid #34435c;border-radius:8px}
button{background:#1c2d43;color:#efffff;border:1px solid #53718a;border-radius:6px;padding:6px 11px;cursor:pointer}button:hover{background:#294761}
#hint{position:absolute;right:12px;top:12px;color:#91a8c4;font-size:11px;background:#0b1525d9;padding:6px 9px;border-radius:5px}
</style></head><body><div id="wrap"><canvas id="map"></canvas><div id="hint">Illustrative particle motion · current model snapshot</div><div id="bar"><button id="toggle">Ⅱ Pause</button><label for="speed">Speed</label><input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"><span id="speedval">1×</span></div></div>
<script>
const model=/*WIND_DATA*/;const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const btn=document.getElementById('toggle'),slider=document.getElementById('speed');
let active=true,last=0,phase=0,scale=1,W=900,H=505;
const colors=['#40e3e7','#7cedc6','#ffe179','#fb74b0','#b58bff'];
const maxSpeed=Math.max(1,...model.trails.map(v=>v.speed));
function resize(){let r=canvas.getBoundingClientRect();W=r.width;H=r.height;scale=Math.min(window.devicePixelRatio||1,1.5);canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0);draw()}
function xy(pt){let [x0,y0,x1,y1]=model.bbox,pad=18,ratio=Math.cos((y0+y1)/2*Math.PI/180);let ww=(x1-x0)*ratio,hh=y1-y0,fac=Math.min((W-2*pad)/Math.max(.001,ww),(H-2*pad)/Math.max(.001,hh));return [W/2+(pt[0]-(x0+x1)/2)*ratio*fac,H/2-(pt[1]-(y0+y1)/2)*fac]}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080c15';ctx.fillRect(0,0,W,H);
ctx.lineWidth=.85;ctx.fillStyle='#142033';ctx.strokeStyle='#405069';
function polygon(ring){ctx.beginPath();let begin=true;for(let pt of ring){let [x,y]=xy(pt);if(begin){ctx.moveTo(x,y);begin=false}else ctx.lineTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke()}
let g=model.outline;if(g.type==='MultiPolygon'){for(let poly of g.coordinates){if(poly.length)polygon(poly[0])}}else if(g.type==='Polygon'){for(let ring of g.coordinates)polygon(ring)}
ctx.lineWidth=.7;ctx.globalAlpha=.11;for(let item of model.trails){let p=item.xy;if(p.length<2)continue;ctx.strokeStyle=colors[Math.min(4,Math.floor(5*item.speed/(maxSpeed+.01)))];ctx.beginPath();p.forEach((v,i)=>{let [x,y]=xy(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
ctx.globalAlpha=1;ctx.lineCap='round';ctx.lineWidth=2;
model.trails.forEach((item,j)=>{let p=item.xy,n=p.length;if(n<4)return;let vel=.5+item.speed/(maxSpeed+.01),index=Math.floor(phase*vel+j*7)%n;ctx.strokeStyle=colors[Math.min(4,Math.floor(5*item.speed/(maxSpeed+.01)))];ctx.beginPath();for(let k=Math.max(0,index-6);k<=index;k++){let [x,y]=xy(p[k]);if(k===Math.max(0,index-6))ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()})}
function tick(t){let elapsed=Math.min(60,t-last||0);last=t;if(active){phase+=elapsed/110*Number(slider.value);draw()}requestAnimationFrame(tick)}
btn.onclick=()=>{active=!active;btn.textContent=active?'Ⅱ Pause':'▶ Play'};
slider.oninput=()=>{document.getElementById('speedval').textContent=slider.value+'×'};
new ResizeObserver(resize).observe(document.getElementById('wrap'));resize();requestAnimationFrame(tick);
</script></body></html>
